<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>健身随身管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 pb-24 select-none">

  <!-- 顶部常驻栏 -->
  <header class="sticky top-0 z-30 bg-slate-900 text-white shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-dumbbell text-emerald-400 text-xl"></i>
        <span class="font-bold text-lg tracking-wide">健身随身管家</span>
        <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-slate-500" title="云端状态"></span>
      </div>
      <div class="flex items-center bg-slate-800 rounded-full px-3 py-1 space-x-2 border border-slate-700">
        <i class="fa-regular fa-clock text-emerald-400 text-xs"></i>
        <span id="workoutTimerDisplay" class="font-mono font-semibold text-sm w-16 text-center">00:00:00</span>
        <button onclick="toggleWorkoutTimer()" id="workoutTimerBtn" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-white w-6 h-6 rounded-full flex items-center justify-center transition">
          <i class="fa-solid fa-play"></i>
        </button>
        <button onclick="resetWorkoutTimer()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 w-6 h-6 rounded-full flex items-center justify-center transition">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4">

    <!-- Tab 1: 训练 -->
    <section id="tab-train" class="tab-content space-y-4">
      <div id="daySelector" class="flex space-x-2 overflow-x-auto no-scrollbar pb-1"></div>
      <div class="flex items-center justify-between bg-white p-3.5 rounded-xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-2">
          <span id="currentDayLabel" class="font-bold text-slate-800 text-base">周三 · 有氧日</span>
          <button onclick="editDayTheme()" class="text-slate-400 hover:text-emerald-600 text-xs px-1.5 py-0.5 rounded bg-slate-50 border border-slate-200">
            <i class="fa-solid fa-pen"></i> 改主题
          </button>
        </div>
        <button onclick="openExerciseModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-medium px-3 py-2 rounded-lg shadow-sm flex items-center space-x-1 transition">
          <i class="fa-solid fa-plus"></i>
          <span>添加动作</span>
        </button>
      </div>
      <div id="exerciseList" class="space-y-3"></div>
      <div class="pt-2">
        <button onclick="finishTodayWorkout()" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-flag-checkered text-emerald-400"></i>
          <span>完成并保存今日训练</span>
        </button>
      </div>
    </section>

    <!-- Tab 2: 日历 -->
    <section id="tab-calendar" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600"><i class="fa-solid fa-chevron-left"></i></button>
          <h2 id="calendarMonthTitle" class="font-bold text-base text-slate-800">日历</h2>
          <button onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-400 mb-2"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 text-center text-sm"></div>
      </div>
      <div id="calendarDayDetail" class="space-y-3"></div>
    </section>

    <!-- Tab 3: 历史 -->
    <section id="tab-history" class="tab-content hidden space-y-4">
      <div class="flex items-center justify-between bg-white p-3.5 rounded-xl shadow-sm border border-slate-100">
        <div>
          <h2 class="font-bold text-slate-800 text-base">历史打卡记录</h2>
          <p class="text-xs text-slate-400" id="historyCountText">共 0 条</p>
        </div>
        <button onclick="clearAllHistory()" class="text-xs text-rose-500 hover:bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg">全部清空</button>
      </div>
      <div id="historyList" class="space-y-3"></div>
    </section>

    <!-- Tab 4: 统计 -->
    <section id="tab-stats" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-slate-800 text-base">动作重量演变趋势</h2>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded font-medium">单位: kg</span>
        </div>
        <div>
          <select id="statsExerciseSelect" onchange="renderStatsChart()" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm"></select>
        </div>
        <div class="relative h-64 w-full">
          <canvas id="weightChart"></canvas>
        </div>
        <p id="statsEmptyTip" class="text-xs text-center text-slate-400 hidden">暂无历史数据</p>
      </div>
    </section>

    <!-- Tab 5: 同步与 AI 计划批量导入 -->
    <section id="tab-sync" class="tab-content hidden space-y-4">
      <!-- 极简云同步 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-bolt text-lg"></i></div>
          <div>
            <h2 class="font-bold text-slate-800 text-base">跨端云同步</h2>
            <p class="text-xs text-slate-400">输入相同口令，两端实时互通</p>
          </div>
        </div>
        <div class="space-y-3 pt-1">
          <div class="flex space-x-2">
            <input type="text" id="syncPasscodeInput" value="chan888" placeholder="口令..." class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
            <button onclick="savePasscode()" class="bg-slate-800 text-white text-xs px-4 py-2 rounded-lg font-medium">保存口令</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="pushToCloud()" id="btnPush" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 px-3 rounded-xl text-sm flex items-center justify-center space-x-1.5">
              <i class="fa-solid fa-cloud-arrow-up"></i><span>上传推送到云端</span>
            </button>
            <button onclick="pullFromCloud(false)" id="btnPull" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2.5 px-3 rounded-xl text-sm flex items-center justify-center space-x-1.5">
              <i class="fa-solid fa-cloud-arrow-down"></i><span>从云端拉取</span>
            </button>
          </div>
          <div id="syncStatusBox" class="text-xs bg-slate-50 text-slate-500 p-2.5 rounded-lg border flex items-center justify-between">
            <span id="syncStatusText">状态：就绪</span>
            <span id="lastSyncTimeText" class="text-[11px] text-slate-400"></span>
          </div>
        </div>
      </div>

      <!-- ✨ 新增：AI 计划智能批量导入卡片 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fa-solid fa-wand-magic-sparkles text-lg"></i></div>
          <div>
            <h2 class="font-bold text-slate-800 text-base">AI 计划一键粘贴导入</h2>
            <p class="text-xs text-slate-400">让 AI 生成 JSON 计划，在此一键粘贴即可整周替换并自动云同步</p>
          </div>
        </div>
        <div>
          <textarea id="aiJsonInput" rows="4" placeholder="请在此处直接粘贴 AI 生成的计划 JSON 文本..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs font-mono focus:outline-none focus:border-purple-500"></textarea>
        </div>
        <div class="flex justify-end">
          <button onclick="importAiJsonText()" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-lg text-xs flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-file-import"></i><span>确认导入并自动同步</span>
          </button>
        </div>
      </div>

      <!-- 常规文件备份 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-slate-800 text-sm">JSON 文件备份</h2>
          <p class="text-xs text-slate-400">导出或导入完整本地文件</p>
        </div>
        <div class="flex space-x-2">
          <button onclick="exportBackupJSON()" class="border px-3 py-1.5 rounded-lg text-xs">导出</button>
          <label class="border px-3 py-1.5 rounded-lg text-xs cursor-pointer bg-slate-50">
            导入<input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importBackupJSON(event)" />
          </label>
        </div>
      </div>
    </section>
  </main>

  <!-- 休息弹窗与导航 -->
  <div id="restFloatingModal" class="fixed bottom-20 right-4 z-40 hidden bg-slate-900/95 text-white p-3.5 rounded-2xl shadow-xl border w-64">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs text-slate-300">组间休息倒计时</span>
      <button onclick="startRestTimer(60)" class="text-[11px] text-slate-400">重置60s</button>
    </div>
    <div class="flex items-center justify-between">
      <span id="restTimerDisplay" class="font-mono font-bold text-2xl text-emerald-400">01:00</span>
      <div class="flex space-x-1.5">
        <button onclick="addRestTime(15)" class="bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg">+15s</button>
        <button onclick="skipRestTimer()" class="bg-rose-500 text-xs px-2.5 py-1.5 rounded-lg">跳过</button>
      </div>
    </div>
  </div>
  <button onclick="startRestTimer(60)" class="fixed bottom-20 left-4 z-30 bg-white border text-slate-700 shadow-md rounded-full px-3 py-2 text-xs font-medium flex items-center space-x-1">
    <i class="fa-solid fa-hourglass-half text-emerald-500"></i><span>休息计时</span>
  </button>

  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-slate-200 shadow-lg">
    <div class="max-w-xl mx-auto grid grid-cols-5 h-16">
      <button onclick="switchTab('train')" id="nav-train" class="nav-btn flex flex-col items-center justify-center text-emerald-600"><i class="fa-solid fa-dumbbell text-lg mb-0.5"></i><span class="text-[11px]">训练</span></button>
      <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn flex flex-col items-center justify-center text-slate-400"><i class="fa-regular fa-calendar-check text-lg mb-0.5"></i><span class="text-[11px]">日历</span></button>
      <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i><span class="text-[11px]">历史</span></button>
      <button onclick="switchTab('stats')" id="nav-stats" class="nav-btn flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-chart-line text-lg mb-0.5"></i><span class="text-[11px]">统计</span></button>
      <button onclick="switchTab('sync')" id="nav-sync" class="nav-btn flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-cloud text-lg mb-0.5"></i><span class="text-[11px]">同步</span></button>
    </div>
  </nav>

  <!-- 动作弹窗 -->
  <div id="exerciseModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b pb-3"><h3 id="modalTitle" class="font-bold text-slate-800 text-base">添加/编辑动作</h3><button onclick="closeExerciseModal()"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <input type="hidden" id="editExerciseId" />
      <div class="space-y-3 text-sm">
        <div><label class="block text-xs text-slate-500 mb-1">动作名称 *</label><input type="text" id="exNameInput" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
        <div class="grid grid-cols-3 gap-2">
          <div><label class="block text-xs text-slate-500 mb-1">组数</label><input type="number" id="exSetsInput" value="3" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
          <div><label class="block text-xs text-slate-500 mb-1">次数/时长</label><input type="text" id="exRepsInput" value="12次" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
          <div><label class="block text-xs text-slate-500 mb-1">重量(kg)</label><input type="number" id="exWeightInput" value="20" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2 border-t"><button onclick="closeExerciseModal()" class="px-4 py-2 bg-slate-100 rounded-lg text-sm">取消</button><button onclick="saveExerciseModal()" class="px-5 py-2 bg-emerald-500 text-white rounded-lg text-sm">保存</button></div>
    </div>
  </div>

  <div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center space-x-2">
    <i class="fa-solid fa-circle-info text-emerald-400"></i><span id="toastText"></span>
  </div>

  <script>
    function createSvgPlaceholder(title, subtitle, colorHex) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280"><rect width="100%" height="100%" fill="${colorHex}" rx="16"/><circle cx="200" cy="100" r="42" fill="rgba(255,255,255,0.18)"/><path d="M175 100 h50 M185 85 v30 M215 85 v30" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/><text x="200" y="180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">${title}</text><text x="200" y="215" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.85)" text-anchor="middle">${subtitle}</text></svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }
    const PRESET_SVGS = {
      "悬垂抬腿": createSvgPlaceholder("悬垂抬腿", "骨盆后倾卷腹", "#059669"),
      "绳索伐木": createSvgPlaceholder("绳索伐木", "核心抗旋发力", "#0284c7"),
      "腹轮": createSvgPlaceholder("腹轮推行", "收紧核心不塌腰", "#7c3aed")
    };
    function isValidImgSrc(src) { return typeof src === "string" && src.startsWith("data:image/"); }

    function getInitialData() {
      return {
        selectedDay: "wed",
        passcode: "chan888",
        lastSync: "",
        days: {
          mon: { name: "周一", theme: "胸+三头", exercises: [{ id: "m1", name: "平板杠铃卧推", targetSets: 4, completedSets: 0, reps: "8-12次", weight: 60, image: "" }] },
          tue: { name: "周二", theme: "背+二头", exercises: [{ id: "tu1", name: "高位下拉", targetSets: 4, completedSets: 0, reps: "10-12次", weight: 50, image: "" }] },
          wed: { name: "周三", theme: "有氧日", exercises: [
            { id: "w1", name: "龙门架卷腹", targetSets: 4, completedSets: 0, reps: "8-12次", weight: 20, image: "" },
            { id: "w2", name: "悬垂抬腿", targetSets: 3, completedSets: 0, reps: "15次", weight: 20, image: PRESET_SVGS["悬垂抬腿"] }
          ]},
          thu: { name: "周四", theme: "肩部训练", exercises: [{ id: "th1", name: "坐姿哑铃推举", targetSets: 4, completedSets: 0, reps: "8-12次", weight: 18, image: "" }] },
          fri: { name: "周五", theme: "腿部训练", exercises: [{ id: "f1", name: "杠铃深蹲", targetSets: 4, completedSets: 0, reps: "8-10次", weight: 80, image: "" }] },
          sat: { name: "周六", theme: "核心+有氧", exercises: [{ id: "sa1", name: "平板支撑", targetSets: 3, completedSets: 0, reps: "60秒", weight: 0, image: "" }] },
          sun: { name: "周日", theme: "休息恢复", exercises: [{ id: "su1", name: "全身拉伸放松", targetSets: 1, completedSets: 0, reps: "15分钟", weight: 0, image: "" }] }
        },
        history: []
      };
    }

    const STORAGE_KEY = "FIT_NTFY_V9";
    const DAY_ORDER = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
    let appData = loadState();
    let currentTab = "train";
    let modalTempImage = "";
    let workoutSeconds = 0, workoutInterval = null, restSeconds = 0, restInterval = null;
    let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
    let selectedCalendarDateStr = formatDateYMD(new Date());
    let weightChartInstance = null;

    function sanitizeData(data) {
      if (!data || !data.days) return getInitialData();
      DAY_ORDER.forEach(k => {
        if (data.days[k] && Array.isArray(data.days[k].exercises)) {
          data.days[k].exercises.forEach(e => {
            if (!isValidImgSrc(e.image)) {
              e.image = PRESET_SVGS[e.name] || "";
            }
          });
        }
      });
      return data;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("FIT_NTFY_V8") || localStorage.getItem("FIT_NTFY_V7_CHUNK");
        if (!raw) return getInitialData();
        const parsed = JSON.parse(raw);
        if (!parsed.passcode || parsed.passcode.startsWith("ghp_")) parsed.passcode = "chan888";
        return sanitizeData(Object.assign(getInitialData(), parsed));
      } catch (e) { return getInitialData(); }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch(e){}
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      document.getElementById("toastText").textContent = msg;
      box.classList.remove("hidden");
      clearTimeout(window._t);
      window._t = setTimeout(() => box.classList.add("hidden"), 2800);
    }

    function formatHMS(sec) {
      return `${String(Math.floor(sec/3600)).padStart(2,"0")}:${String(Math.floor((sec%3600)/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
    }
    function formatDateYMD(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    function toggleWorkoutTimer() {
      const btn = document.getElementById("workoutTimerBtn");
      if (workoutInterval) { clearInterval(workoutInterval); workoutInterval = null; btn.innerHTML = '<i class="fa-solid fa-play"></i>'; }
      else {
        workoutInterval = setInterval(() => { workoutSeconds++; document.getElementById("workoutTimerDisplay").textContent = formatHMS(workoutSeconds); }, 1000);
        btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      }
    }
    function resetWorkoutTimer() {
      if (workoutInterval) clearInterval(workoutInterval);
      workoutInterval = null; workoutSeconds = 0;
      document.getElementById("workoutTimerDisplay").textContent = "00:00:00";
      document.getElementById("workoutTimerBtn").innerHTML = '<i class="fa-solid fa-play"></i>';
    }

    function startRestTimer(s) {
      restSeconds = s;
      document.getElementById("restFloatingModal").classList.remove("hidden");
      document.getElementById("restTimerDisplay").textContent = `00:${String(s).padStart(2,"0")}`;
      if (restInterval) clearInterval(restInterval);
      restInterval = setInterval(() => {
        restSeconds--;
        if (restSeconds <= 0) { skipRestTimer(); showToast("休息结束！"); }
        else { document.getElementById("restTimerDisplay").textContent = `00:${String(restSeconds).padStart(2,"0")}`; }
      }, 1000);
    }
    function addRestTime(s) { restSeconds += s; }
    function skipRestTimer() { if (restInterval) clearInterval(restInterval); restInterval = null; document.getElementById("restFloatingModal").classList.add("hidden"); }

    function switchTab(t) {
      currentTab = t;
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById(`tab-${t}`).classList.remove("hidden");
      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.replace("text-emerald-600", "text-slate-400"));
      document.getElementById(`nav-${t}`).classList.replace("text-slate-400", "text-emerald-600");
      if (t === "train") renderTrainTab();
      if (t === "calendar") renderCalendarTab();
      if (t === "history") renderHistoryTab();
      if (t === "stats") renderStatsTab();
      if (t === "sync") renderSyncTab();
    }

    // 训练渲染
    function renderTrainTab() {
      const selector = document.getElementById("daySelector");
      selector.innerHTML = "";
      DAY_ORDER.forEach(k => {
        const d = appData.days[k];
        const isSel = appData.selectedDay === k;
        const btn = document.createElement("button");
        btn.className = `flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-medium border transition ${isSel ? 'bg-slate-900 text-white border-slate-900 shadow-xs' : 'bg-white text-slate-600 border-slate-200'}`;
        btn.innerHTML = `<div class="font-bold">${d.name}</div><div class="text-[10px] ${isSel ? 'text-emerald-400' : 'text-slate-400'}">${d.theme}</div>`;
        btn.onclick = () => { appData.selectedDay = k; saveState(); renderTrainTab(); };
        selector.appendChild(btn);
      });

      const curDay = appData.days[appData.selectedDay];
      document.getElementById("currentDayLabel").textContent = `${curDay.name}（${curDay.theme}）`;
      const listEl = document.getElementById("exerciseList");
      listEl.innerHTML = "";

      if (!curDay.exercises || curDay.exercises.length === 0) {
        listEl.innerHTML = `<div class="bg-white rounded-xl p-8 text-center text-slate-400 text-sm border border-slate-100">今日暂无动作</div>`;
        return;
      }

      curDay.exercises.forEach((ex, idx) => {
        const isDone = ex.completedSets >= ex.targetSets;
        const progressPct = Math.min(100, Math.round((ex.completedSets / ex.targetSets) * 100));
        const weightBadge = ex.weight > 0 ? `<span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs font-medium">${ex.weight}kg</span>` : "";
        const validImg = isValidImgSrc(ex.image);

        const card = document.createElement("div");
        card.className = `bg-white rounded-xl p-4 shadow-sm border transition ${isDone ? 'border-emerald-400 bg-emerald-50/20' : 'border-slate-100'}`;
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start space-x-3 flex-1 min-w-0">
              ${validImg ? `<img src="${ex.image}" alt="图" class="w-16 h-16 rounded-lg object-cover border flex-shrink-0"/>` : `<div class="w-16 h-16 rounded-lg bg-slate-50 border flex items-center justify-center text-slate-400 text-xs flex-shrink-0">无图</div>`}
              <div class="flex-1 min-w-0">
                <h3 class="font-bold text-slate-800 text-base truncate">${idx + 1}. ${ex.name}</h3>
                <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                  <span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-xs font-medium">${ex.targetSets}组</span>
                  <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-xs font-medium">${ex.reps}</span>
                  ${weightBadge}
                </div>
              </div>
            </div>
            <div class="flex items-center space-x-0.5 text-slate-400">
              <button onclick="openExerciseModal('${ex.id}')" class="w-7 h-7 rounded hover:bg-slate-100 hover:text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="deleteExercise('${ex.id}')" class="w-7 h-7 rounded hover:bg-rose-50 hover:text-rose-500 flex items-center justify-center"><i class="fa-regular fa-trash-can text-xs"></i></button>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
            <div class="flex-1 mr-4">
              <div class="flex justify-between text-xs mb-1"><span class="text-slate-500">进度</span><span class="font-bold">${ex.completedSets}/${ex.targetSets}组</span></div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width: ${progressPct}%"></div></div>
            </div>
            <div class="flex items-center space-x-1.5">
              <button onclick="changeSetCount('${ex.id}', -1)" class="w-8 h-8 rounded-lg bg-slate-100 font-bold">-</button>
              <button onclick="changeSetCount('${ex.id}', 1)" class="px-3.5 h-8 rounded-lg bg-emerald-500 text-white text-xs font-bold">+1组</button>
            </div>
          </div>`;
        listEl.appendChild(card);
      });
    }

    function changeSetCount(id, d) {
      const ex = appData.days[appData.selectedDay].exercises.find(i => i.id === id);
      if (!ex) return;
      ex.completedSets = Math.max(0, ex.completedSets + d);
      saveState();
      renderTrainTab();
      if (d > 0) startRestTimer(60);
    }
    function deleteExercise(id) {
      if (!confirm("删除动作？")) return;
      appData.days[appData.selectedDay].exercises = appData.days[appData.selectedDay].exercises.filter(e => e.id !== id);
      saveState(); renderTrainTab();
    }
    function editDayTheme() {
      const cur = appData.days[appData.selectedDay];
      const res = prompt("修改主题", cur.theme);
      if (res) { cur.theme = res.trim(); saveState(); renderTrainTab(); }
    }
    function openExerciseModal(exId = null) {
      if (exId) {
        const ex = appData.days[appData.selectedDay].exercises.find(e => e.id === exId);
        document.getElementById("editExerciseId").value = ex.id;
        document.getElementById("exNameInput").value = ex.name;
        document.getElementById("exSetsInput").value = ex.targetSets;
        document.getElementById("exRepsInput").value = ex.reps;
        document.getElementById("exWeightInput").value = ex.weight;
      } else {
        document.getElementById("editExerciseId").value = "";
        document.getElementById("exNameInput").value = "";
      }
      document.getElementById("exerciseModal").classList.remove("hidden");
    }
    function closeExerciseModal() { document.getElementById("exerciseModal").classList.add("hidden"); }
    function saveExerciseModal() {
      const id = document.getElementById("editExerciseId").value;
      const name = document.getElementById("exNameInput").value.trim();
      const sets = parseInt(document.getElementById("exSetsInput").value) || 3;
      const reps = document.getElementById("exRepsInput").value.trim() || "12次";
      const weight = parseFloat(document.getElementById("exWeightInput").value) || 0;
      if (!name) return;
      const cur = appData.days[appData.selectedDay];
      if (id) {
        const ex = cur.exercises.find(e => e.id === id);
        if (ex) { ex.name = name; ex.targetSets = sets; ex.reps = reps; ex.weight = weight; }
      } else {
        cur.exercises.push({ id: "ex_" + Date.now(), name, targetSets: sets, completedSets: 0, reps, weight, image: "" });
      }
      saveState(); closeExerciseModal(); renderTrainTab();
    }

    function finishTodayWorkout() {
      const cur = appData.days[appData.selectedDay];
      appData.history.unshift({
        id: "rec_" + Date.now(), date: formatDateYMD(new Date()), time: new Date().toTimeString().slice(0, 5),
        dayTitle: `${cur.name} · ${cur.theme}`, durationSeconds: workoutSeconds,
        items: cur.exercises.map(e => ({ name: e.name, completedSets: e.completedSets || e.targetSets, weight: e.weight }))
      });
      cur.exercises.forEach(e => e.completedSets = 0);
      resetWorkoutTimer(); saveState(); renderTrainTab(); showToast("今日训练已归档！");
    }

    // ✨ 核心优化：AI JSON 智能文本粘贴导入
    function importAiJsonText() {
      const rawText = document.getElementById("aiJsonInput").value.trim();
      if (!rawText) { showToast("请先粘贴 AI 生成的 JSON 内容"); return; }
      try {
        // 自动清洗可能带有 Markdown 的代码块符号
        let cleanStr = rawText;
        if (cleanStr.includes("```json")) {
          cleanStr = cleanStr.split("```json")[1].split("```")[0].trim();
        } else if (cleanStr.includes("```")) {
          cleanStr = cleanStr.split("```")[1].split("```")[0].trim();
        }
        
        const imported = JSON.parse(cleanStr);
        if (!imported.days || !imported.days.mon) {
          throw new Error("JSON 结构缺少 days 数据");
        }
        
        appData = sanitizeData(Object.assign(appData, imported));
        saveState();
        document.getElementById("aiJsonInput").value = "";
        switchTab("train");
        showToast("✨ AI 计划导入成功！正在为您自动推送到云端...");
        
        // 导入成功后自动推送到云端，实现一步到位
        setTimeout(() => { pushToCloud(); }, 600);
      } catch (err) {
        showToast("解析失败：请确保复制的是完整的标准 JSON");
      }
    }

    // 基础云同步
    function renderSyncTab() {
      document.getElementById("syncPasscodeInput").value = appData.passcode || "chan888";
      if (appData.lastSync) document.getElementById("lastSyncTimeText").textContent = `上次同步: ${appData.lastSync}`;
    }
    function savePasscode() {
      appData.passcode = document.getElementById("syncPasscodeInput").value.trim() || "chan888";
      saveState(); showToast("口令已保存");
    }
    function updateSyncStatus(text, ok) {
      const el = document.getElementById("syncStatusText");
      el.textContent = "状态：" + text;
      el.className = ok ? "text-emerald-600 font-medium" : "text-rose-500 font-medium";
    }

    async function pushToCloud() {
      const code = appData.passcode || "chan888";
      const btn = document.getElementById("btnPush");
      if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>推送中...</span>'; }
      updateSyncStatus("正在同步到云端...", true);
      try {
        const res = await fetch(`https://ntfy.sh/fit_butler_cn_${encodeURIComponent(code)}`, {
          method: "POST", body: "FITMAIN:" + window.btoa(unescape(encodeURIComponent(JSON.stringify(appData))))
        });
        if (!res.ok) throw new Error();
        appData.lastSync = new Date().toLocaleTimeString();
        saveState(); renderSyncTab();
        updateSyncStatus("云端推送成功！", true); showToast("已成功推送到云端！");
      } catch(e) {
        updateSyncStatus("推送失败", false); showToast("云端推送失败");
      } finally {
        if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i><span>上传推送到云端</span>'; }
      }
    }

    async function pullFromCloud(silent = false) {
      const code = appData.passcode || "chan888";
      const btn = document.getElementById("btnPull");
      if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>拉取中...</span>'; }
      if(!silent) updateSyncStatus("正在从云端拉取...", true);
      try {
        const res = await fetch(`https://ntfy.sh/fit_butler_cn_${encodeURIComponent(code)}/json?poll=1&since=24h`);
        if (!res.ok) throw new Error();
        const lines = (await res.text()).trim().split("\n").filter(Boolean);
        let b64 = "";
        for(let i=lines.length-1; i>=0; i--) {
          try {
            const row = JSON.parse(lines[i]);
            if(row.message && row.message.startsWith("FITMAIN:")) { b64 = row.message.split(":")[1]; break; }
          }catch(e){}
        }
        if(!b64) throw new Error();
        appData = sanitizeData(JSON.parse(decodeURIComponent(escape(window.atob(b64)))));
        saveState(); switchTab(currentTab);
        updateSyncStatus("拉取并同步成功！", true); showToast(silent ? "已自动同步" : "拉取成功！");
      } catch(e) {
        if(!silent) { updateSyncStatus("云端暂无记录", false); showToast("未找到云端记录"); }
      } finally {
        if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i><span>从云端拉取</span>'; }
      }
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `健身计划备份_${formatDateYMD(new Date())}.json`; a.click();
    }
    function importBackupJSON(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          appData = sanitizeData(JSON.parse(ev.target.result));
          saveState(); switchTab("train"); showToast("导入成功并已保存！");
          pushToCloud();
        } catch(err) { showToast("文件解析失败"); }
      };
      reader.readAsText(file); e.target.value = "";
    }
    function resetToDefaultData() {
      if(!confirm("恢复预置计划？")) return;
      appData = getInitialData(); saveState(); switchTab("train"); showToast("已恢复预置计划");
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderTrainTab(); renderSyncTab();
      if(appData.passcode) pullFromCloud(true);
    });
  </script>
</body>
</html>
