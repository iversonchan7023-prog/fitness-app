<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>健身随身管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 pb-24 select-none">

  <!-- 顶部常驻栏 -->
  <header class="sticky top-0 z-30 bg-slate-900 text-white shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-dumbbell text-emerald-400 text-xl"></i>
        <span class="font-bold text-lg tracking-wide">健身随身管家</span>
        <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-slate-500" title="云端状态"></span>
      </div>
      <div class="flex items-center bg-slate-800 rounded-full px-3 py-1 space-x-2 border border-slate-700">
        <i class="fa-regular fa-clock text-emerald-400 text-xs"></i>
        <span id="workoutTimerDisplay" class="font-mono font-semibold text-sm w-16 text-center">00:00:00</span>
        <button onclick="toggleWorkoutTimer()" id="workoutTimerBtn" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-white w-6 h-6 rounded-full flex items-center justify-center transition">
          <i class="fa-solid fa-play"></i>
        </button>
        <button onclick="resetWorkoutTimer()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 w-6 h-6 rounded-full flex items-center justify-center transition" title="重置计时">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4">

    <!-- Tab 1: 训练 -->
    <section id="tab-train" class="tab-content space-y-4">
      <div id="daySelector" class="flex space-x-2 overflow-x-auto no-scrollbar pb-1"></div>
      <div class="flex items-center justify-between bg-white p-3.5 rounded-xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-2">
          <span id="currentDayLabel" class="font-bold text-slate-800 text-base">周三 · 有氧日</span>
          <button onclick="editDayTheme()" class="text-slate-400 hover:text-emerald-600 text-xs px-1.5 py-0.5 rounded bg-slate-50 border border-slate-200">
            <i class="fa-solid fa-pen"></i> 改主题
          </button>
        </div>
        <button onclick="openExerciseModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-medium px-3 py-2 rounded-lg shadow-sm flex items-center space-x-1 transition">
          <i class="fa-solid fa-plus"></i>
          <span>添加动作</span>
        </button>
      </div>
      <div id="exerciseList" class="space-y-3"></div>
      <div class="pt-2">
        <button onclick="finishTodayWorkout()" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-flag-checkered text-emerald-400"></i>
          <span>完成并保存今日训练</span>
        </button>
      </div>
    </section>

    <!-- Tab 2: 日历 -->
    <section id="tab-calendar" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <h2 id="calendarMonthTitle" class="font-bold text-base text-slate-800">日历</h2>
          <button onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-400 mb-2">
          <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 text-center text-sm"></div>
      </div>
      <div id="calendarDayDetail" class="space-y-3"></div>
    </section>

    <!-- Tab 3: 历史 -->
    <section id="tab-history" class="tab-content hidden space-y-4">
      <div class="flex items-center justify-between bg-white p-3.5 rounded-xl shadow-sm border border-slate-100">
        <div>
          <h2 class="font-bold text-slate-800 text-base">历史记录</h2>
          <p class="text-xs text-slate-400" id="historyCountText">共 0 条</p>
        </div>
        <button onclick="clearAllHistory()" class="text-xs text-rose-500 hover:bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg">清空</button>
      </div>
      <div id="historyList" class="space-y-3"></div>
    </section>

    <!-- Tab 4: 统计 -->
    <section id="tab-stats" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-slate-800 text-base">配重趋势</h2>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded font-medium">kg</span>
        </div>
        <div>
          <select id="statsExerciseSelect" onchange="renderStatsChart()" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm"></select>
        </div>
        <div class="relative h-64 w-full">
          <canvas id="weightChart"></canvas>
        </div>
        <p id="statsEmptyTip" class="text-xs text-center text-slate-400 hidden">暂无历史打卡数据</p>
      </div>
    </section>

    <!-- Tab 5: 极简免配置同步 -->
    <section id="tab-sync" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center">
            <i class="fa-solid fa-cloud-bolt text-lg"></i>
          </div>
          <div>
            <h2 class="font-bold text-slate-800 text-base">极简口令跨端同步</h2>
            <p class="text-xs text-slate-400">免Token、免注册，两端输入相同口令即可互通</p>
          </div>
        </div>

        <div class="space-y-3 pt-1">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">设置您的专属同步口令（如：chan888 或任意专属字符）</label>
            <div class="flex space-x-2">
              <input 
                type="text" 
                id="syncPasscodeInput" 
                placeholder="请输入专属同步口令..." 
                class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" 
              />
              <button onclick="savePasscode()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2 rounded-lg font-medium transition">
                保存口令
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="pushToCloud()" id="btnPush" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 px-3 rounded-xl shadow-sm flex items-center justify-center space-x-1.5 text-sm transition">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>上传推送到云端</span>
            </button>
            <button onclick="pullFromCloud(false)" id="btnPull" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2.5 px-3 rounded-xl shadow-sm flex items-center justify-center space-x-1.5 text-sm transition">
              <i class="fa-solid fa-cloud-arrow-down"></i>
              <span>从云端拉取</span>
            </button>
          </div>

          <div id="syncStatusBox" class="text-xs bg-slate-50 text-slate-500 p-2.5 rounded-lg border border-slate-100 flex items-center justify-between">
            <span id="syncStatusText">状态：等待同步操作</span>
            <span id="lastSyncTimeText" class="text-[11px] text-slate-400"></span>
          </div>
        </div>
      </div>

      <!-- 离线 JSON 备份 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center">
            <i class="fa-solid fa-file-shield"></i>
          </div>
          <div>
            <h2 class="font-bold text-slate-800 text-base">离线文件备份（兜底）</h2>
            <p class="text-xs text-slate-400">导出文件通过微信发送给手机，导入即同步</p>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 pt-1">
          <button onclick="exportBackupJSON()" class="border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium py-2 px-3 rounded-xl text-xs flex items-center justify-center space-x-1">
            <i class="fa-solid fa-download"></i><span>导出备份</span>
          </button>
          <label class="border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium py-2 px-3 rounded-xl text-xs flex items-center justify-center space-x-1 cursor-pointer">
            <i class="fa-solid fa-upload"></i><span>导入备份</span>
            <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importBackupJSON(event)" />
          </label>
        </div>
      </div>
    </section>

  </main>

  <!-- 休息倒计时 -->
  <div id="restFloatingModal" class="fixed bottom-20 right-4 z-40 hidden bg-slate-900/95 backdrop-blur text-white p-3.5 rounded-2xl shadow-xl border border-slate-700 w-64">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs text-slate-300"><i class="fa-solid fa-mug-hot text-emerald-400 mr-1"></i>休息倒计时</span>
      <button onclick="startRestTimer(60)" class="text-[11px] text-slate-400 hover:text-white">60s</button>
    </div>
    <div class="flex items-center justify-between">
      <span id="restTimerDisplay" class="font-mono font-bold text-2xl text-emerald-400">01:00</span>
      <div class="flex space-x-1.5">
        <button onclick="addRestTime(15)" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg">+15s</button>
        <button onclick="skipRestTimer()" class="bg-rose-500 hover:bg-rose-600 text-xs px-2.5 py-1.5 rounded-lg">跳过</button>
      </div>
    </div>
  </div>

  <button onclick="startRestTimer(60)" class="fixed bottom-20 left-4 z-30 bg-white border border-slate-200 text-slate-700 shadow-md rounded-full px-3 py-2 text-xs font-medium flex items-center space-x-1">
    <i class="fa-solid fa-hourglass-half text-emerald-500"></i><span>休息计时</span>
  </button>

  <!-- 底部导航 -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-slate-200 shadow-lg">
    <div class="max-w-xl mx-auto grid grid-cols-5 h-16">
      <button onclick="switchTab('train')" id="nav-train" class="nav-btn flex flex-col items-center justify-center text-emerald-600">
        <i class="fa-solid fa-dumbbell text-lg mb-0.5"></i><span class="text-[11px] font-medium">训练</span>
      </button>
      <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn flex flex-col items-center justify-center text-slate-400">
        <i class="fa-regular fa-calendar-check text-lg mb-0.5"></i><span class="text-[11px] font-medium">日历</span>
      </button>
      <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center justify-center text-slate-400">
        <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i><span class="text-[11px] font-medium">历史</span>
      </button>
      <button onclick="switchTab('stats')" id="nav-stats" class="nav-btn flex flex-col items-center justify-center text-slate-400">
        <i class="fa-solid fa-chart-line text-lg mb-0.5"></i><span class="text-[11px] font-medium">统计</span>
      </button>
      <button onclick="switchTab('sync')" id="nav-sync" class="nav-btn flex flex-col items-center justify-center text-slate-400">
        <i class="fa-solid fa-cloud text-lg mb-0.5"></i><span class="text-[11px] font-medium">同步</span>
      </button>
    </div>
  </nav>

  <!-- 动作弹窗 -->
  <div id="exerciseModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4">
      <h3 id="modalTitle" class="font-bold text-slate-800 text-base">添加动作</h3>
      <input type="hidden" id="editExerciseId" />
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">名称</label>
          <input type="text" id="exNameInput" class="w-full border border-slate-200 rounded-lg px-3 py-2" />
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs text-slate-500 mb-1">组数</label>
            <input type="number" id="exSetsInput" value="3" class="w-full border border-slate-200 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">次数</label>
            <input type="text" id="exRepsInput" value="12次" class="w-full border border-slate-200 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">重量(kg)</label>
            <input type="number" id="exWeightInput" value="20" class="w-full border border-slate-200 rounded-lg px-3 py-2" />
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeExerciseModal()" class="px-4 py-2 rounded-lg text-sm bg-slate-100">取消</button>
        <button onclick="saveExerciseModal()" class="px-5 py-2 rounded-lg text-sm text-white bg-emerald-500">保存</button>
      </div>
    </div>
  </div>

  <div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg">
    <span id="toastText"></span>
  </div>

  <script>
    function getInitialData() {
      return {
        selectedDay: "wed",
        passcode: "chan888",
        lastSync: "",
        days: {
          mon: { name: "周一", theme: "胸+三头", exercises: [{ id: "m1", name: "平板杠铃卧推", targetSets: 4, completedSets: 0, reps: "8-12次", weight: 60 }] },
          tue: { name: "周二", theme: "背+二头", exercises: [{ id: "tu1", name: "高位下拉", targetSets: 4, completedSets: 0, reps: "10-12次", weight: 50 }] },
          wed: { name: "周三", theme: "有氧日", exercises: [
            { id: "w1", name: "龙门架卷腹", targetSets: 4, completedSets: 0, reps: "8-12次", weight: 20 },
            { id: "w2", name: "悬垂抬腿", targetSets: 3, completedSets: 0, reps: "15次", weight: 20 },
            { id: "w3", name: "绳索伐木", targetSets: 3, completedSets: 0, reps: "15次", weight: 20 },
            { id: "w4", name: "腹轮", targetSets: 3, completedSets: 0, reps: "10-12次", weight: 20 },
            { id: "w5", name: "跑步机", targetSets: 1, completedSets: 0, reps: "20分钟", weight: 0 }
          ]},
          thu: { name: "周四", theme: "肩部训练", exercises: [{ id: "th1", name: "坐姿哑铃推举", targetSets: 4, completedSets: 0, reps: "8-12次", weight: 18 }] },
          fri: { name: "周五", theme: "腿部训练", exercises: [{ id: "f1", name: "杠铃深蹲", targetSets: 4, completedSets: 0, reps: "8-10次", weight: 80 }] },
          sat: { name: "周六", theme: "核心+有氧", exercises: [{ id: "sa1", name: "平板支撑", targetSets: 3, completedSets: 0, reps: "60秒", weight: 0 }] },
          sun: { name: "周日", theme: "休息恢复", exercises: [{ id: "su1", name: "全身拉伸放松", targetSets: 1, completedSets: 0, reps: "15分钟", weight: 0 }] }
        },
        history: []
      };
    }

    const STORAGE_KEY = "FIT_STATE_LOCAL_V3";
    let appData = loadState();
    let currentTab = "train";
    let workoutSeconds = 0, workoutInterval = null, restSeconds = 0, restInterval = null;
    let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
    let selectedCalendarDateStr = formatDateYMD(new Date());
    let weightChartInstance = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? Object.assign(getInitialData(), JSON.parse(raw)) : getInitialData();
      } catch (e) {
        return getInitialData();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      document.getElementById("toastText").textContent = msg;
      box.classList.remove("hidden");
      clearTimeout(window._t);
      window._t = setTimeout(() => box.classList.add("hidden"), 2500);
    }

    function formatHMS(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function formatDateYMD(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function toggleWorkoutTimer() {
      const btn = document.getElementById("workoutTimerBtn");
      if (workoutInterval) {
        clearInterval(workoutInterval);
        workoutInterval = null;
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      } else {
        workoutInterval = setInterval(() => {
          workoutSeconds++;
          document.getElementById("workoutTimerDisplay").textContent = formatHMS(workoutSeconds);
        }, 1000);
        btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      }
    }

    function resetWorkoutTimer() {
      if (workoutInterval) clearInterval(workoutInterval);
      workoutInterval = null;
      workoutSeconds = 0;
      document.getElementById("workoutTimerDisplay").textContent = "00:00:00";
      document.getElementById("workoutTimerBtn").innerHTML = '<i class="fa-solid fa-play"></i>';
    }

    function startRestTimer(s) {
      restSeconds = s;
      document.getElementById("restFloatingModal").classList.remove("hidden");
      document.getElementById("restTimerDisplay").textContent = `00:${String(s).padStart(2, "0")}`;
      if (restInterval) clearInterval(restInterval);
      restInterval = setInterval(() => {
        restSeconds--;
        if (restSeconds <= 0) {
          skipRestTimer();
          showToast("休息结束！");
        } else {
          const m = String(Math.floor(restSeconds / 60)).padStart(2, "0");
          const sec = String(restSeconds % 60).padStart(2, "0");
          document.getElementById("restTimerDisplay").textContent = `${m}:${sec}`;
        }
      }, 1000);
    }

    function addRestTime(s) { restSeconds += s; }
    function skipRestTimer() {
      if (restInterval) clearInterval(restInterval);
      restInterval = null;
      document.getElementById("restFloatingModal").classList.add("hidden");
    }

    function switchTab(t) {
      currentTab = t;
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById(`tab-${t}`).classList.remove("hidden");
      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.replace("text-emerald-600", "text-slate-400"));
      document.getElementById(`nav-${t}`).classList.replace("text-slate-400", "text-emerald-600");

      if (t === "train") renderTrainTab();
      if (t === "calendar") renderCalendarTab();
      if (t === "history") renderHistoryTab();
      if (t === "stats") renderStatsTab();
      if (t === "sync") renderSyncTab();
    }

    const DAY_ORDER = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];

    function renderTrainTab() {
      const selector = document.getElementById("daySelector");
      selector.innerHTML = "";
      DAY_ORDER.forEach(k => {
        const d = appData.days[k];
        const isSel = appData.selectedDay === k;
        const btn = document.createElement("button");
        btn.className = `flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-medium border ${isSel ? 'bg-slate-900 text-white' : 'bg-white text-slate-600'}`;
        btn.innerHTML = `<div class="font-bold">${d.name}</div><div class="text-[10px] text-slate-400">${d.theme}</div>`;
        btn.onclick = () => { appData.selectedDay = k; saveState(); renderTrainTab(); };
        selector.appendChild(btn);
      });

      const curDay = appData.days[appData.selectedDay];
      document.getElementById("currentDayLabel").textContent = `${curDay.name} · ${curDay.theme}`;
      const listEl = document.getElementById("exerciseList");
      listEl.innerHTML = "";

      curDay.exercises.forEach((ex, idx) => {
        const isDone = ex.completedSets >= ex.targetSets;
        const card = document.createElement("div");
        card.className = `bg-white rounded-xl p-4 shadow-sm border ${isDone ? 'border-emerald-400 bg-emerald-50/20' : 'border-slate-100'}`;
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-bold text-slate-800">${idx + 1}. ${ex.name}</h3>
              <p class="text-xs text-slate-500 mt-1">${ex.targetSets}组 · ${ex.reps} · <b>${ex.weight}kg</b></p>
            </div>
            <div class="flex items-center space-x-1.5">
              <button onclick="changeSetCount('${ex.id}', -1)" class="w-8 h-8 rounded-lg bg-slate-100 font-bold">-</button>
              <span class="text-xs font-bold px-2">${ex.completedSets}/${ex.targetSets}组</span>
              <button onclick="changeSetCount('${ex.id}', 1)" class="px-3 h-8 rounded-lg bg-emerald-500 text-white text-xs font-bold">+1组</button>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function changeSetCount(id, d) {
      const ex = appData.days[appData.selectedDay].exercises.find(i => i.id === id);
      if (!ex) return;
      ex.completedSets = Math.max(0, ex.completedSets + d);
      saveState();
      renderTrainTab();
      if (d > 0) startRestTimer(60);
    }

    function editDayTheme() {
      const cur = appData.days[appData.selectedDay];
      const res = prompt("修改训练主题", cur.theme);
      if (res) { cur.theme = res.trim(); saveState(); renderTrainTab(); }
    }

    function openExerciseModal() {
      document.getElementById("exNameInput").value = "";
      document.getElementById("exerciseModal").classList.remove("hidden");
    }
    function closeExerciseModal() {
      document.getElementById("exerciseModal").classList.add("hidden");
    }
    function saveExerciseModal() {
      const name = document.getElementById("exNameInput").value.trim();
      const sets = parseInt(document.getElementById("exSetsInput").value) || 3;
      const reps = document.getElementById("exRepsInput").value.trim() || "12次";
      const weight = parseFloat(document.getElementById("exWeightInput").value) || 0;
      if (!name) return;
      appData.days[appData.selectedDay].exercises.push({
        id: "ex_" + Date.now(), name, targetSets: sets, completedSets: 0, reps, weight
      });
      saveState();
      closeExerciseModal();
      renderTrainTab();
    }

    function finishTodayWorkout() {
      const cur = appData.days[appData.selectedDay];
      appData.history.unshift({
        id: "rec_" + Date.now(),
        date: formatDateYMD(new Date()),
        time: new Date().toTimeString().slice(0, 5),
        dayTitle: `${cur.name} · ${cur.theme}`,
        durationSeconds: workoutSeconds,
        items: cur.exercises.map(e => ({ name: e.name, completedSets: e.completedSets || e.targetSets, weight: e.weight }))
      });
      cur.exercises.forEach(e => e.completedSets = 0);
      resetWorkoutTimer();
      saveState();
      renderTrainTab();
      showToast("今日训练已归档！");
    }

    function renderCalendarTab() {
      document.getElementById("calendarMonthTitle").textContent = `${calYear}年 ${calMonth + 1}月`;
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";
      const firstDay = new Date(calYear, calMonth, 1);
      const startW = (firstDay.getDay() + 6) % 7;
      const totalD = new Date(calYear, calMonth + 1, 0).getDate();
      const hasRec = new Set(appData.history.map(r => r.date));

      for (let i = 0; i < startW; i++) grid.appendChild(document.createElement("div"));
      for (let d = 1; d <= totalD; d++) {
        const dStr = `${calYear}-${String(calMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const b = document.createElement("button");
        b.className = `h-10 rounded-xl text-xs font-medium ${selectedCalendarDateStr === dStr ? 'bg-slate-900 text-white' : hasRec.has(dStr) ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-50'}`;
        b.textContent = d;
        b.onclick = () => { selectedCalendarDateStr = dStr; renderCalendarTab(); };
        grid.appendChild(b);
      }
      const recs = appData.history.filter(r => r.date === selectedCalendarDateStr);
      document.getElementById("calendarDayDetail").innerHTML = recs.length === 0 ? `<div class="text-center text-xs text-slate-400 py-4">无训练记录</div>` : recs.map(r => `
        <div class="bg-white p-3 rounded-xl border border-slate-100 text-xs">
          <div class="font-bold text-slate-700">${r.dayTitle} (${r.time})</div>
          <div class="mt-1 text-slate-500">${r.items.map(i => `${i.name} ${i.completedSets}组`).join(", ")}</div>
        </div>
      `).join("");
    }
    function changeCalendarMonth(d) {
      calMonth += d;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendarTab();
    }

    function renderHistoryTab() {
      document.getElementById("historyCountText").textContent = `共 ${appData.history.length} 条`;
      document.getElementById("historyList").innerHTML = appData.history.map(r => `
        <div class="bg-white p-3.5 rounded-xl border border-slate-100 text-xs flex justify-between items-center">
          <div>
            <div class="font-bold text-slate-800">${r.dayTitle}</div>
            <div class="text-slate-400 mt-0.5">${r.date} ${r.time} · 用时 ${formatHMS(r.durationSeconds || 0)}</div>
          </div>
          <button onclick="deleteHistory('${r.id}')" class="text-rose-500"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      `).join("");
    }
    function deleteHistory(id) {
      appData.history = appData.history.filter(i => i.id !== id);
      saveState();
      renderHistoryTab();
    }
    function clearAllHistory() {
      if (confirm("清空历史？")) { appData.history = []; saveState(); renderHistoryTab(); }
    }

    function renderStatsTab() {
      const select = document.getElementById("statsExerciseSelect");
      const names = new Set();
      DAY_ORDER.forEach(k => appData.days[k].exercises.forEach(e => names.add(e.name)));
      select.innerHTML = Array.from(names).map(n => `<option value="${n}">${n}</option>`).join("");
      renderStatsChart();
    }

    function renderStatsChart() {
      const name = document.getElementById("statsExerciseSelect").value;
      const pts = [];
      [...appData.history].reverse().forEach(r => {
        const item = r.items.find(i => i.name === name);
        if (item) pts.push({ label: r.date.slice(5), weight: item.weight || 0 });
      });
      if (pts.length === 0) pts.push({ label: "预设", weight: 20 });
      const ctx = document.getElementById("weightChart").getContext("2d");
      if (weightChartInstance) weightChartInstance.destroy();
      weightChartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: pts.map(p => p.label),
          datasets: [{ label: `${name} (kg)`, data: pts.map(p => p.weight), borderColor: "#10b981", tension: 0.3 }]
        }
      });
    }

    // ==================== 极简口令云同步核心逻辑 ====================
    function renderSyncTab() {
      document.getElementById("syncPasscodeInput").value = appData.passcode || "chan888";
      if (appData.lastSync) document.getElementById("lastSyncTimeText").textContent = `上次同步: ${appData.lastSync}`;
    }

    function savePasscode() {
      const code = document.getElementById("syncPasscodeInput").value.trim();
      if (!code) { showToast("口令不能为空"); return; }
      appData.passcode = code;
      saveState();
      showToast("口令已保存！");
    }

    function updateSyncStatus(text, ok) {
      const el = document.getElementById("syncStatusText");
      const dot = document.getElementById("cloudStatusDot");
      el.textContent = "状态：" + text;
      el.className = ok ? "text-emerald-600 font-medium" : "text-rose-500 font-medium";
      dot.className = `w-2 h-2 rounded-full ${ok ? 'bg-emerald-400' : 'bg-rose-400'}`;
    }

    // 国内多通道自动竞速与兜底机制
    async function pushToCloud() {
      const code = document.getElementById("syncPasscodeInput").value.trim();
      if (!code) { showToast("请先设置口令"); return; }
      appData.passcode = code;

      const btn = document.getElementById("btnPush");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>上传中...</span>';
      updateSyncStatus("正在推送到云端...", true);

      const payload = JSON.stringify(appData);
      const safeKey = "fit_" + encodeURIComponent(code);

      try {
        let ok = false;

        // 通道 1: 国内免翻直连轻量通道 (支持所有浏览器跨域 CORS)
        try {
          const r1 = await fetch(`https://api.keyvalue.xyz/set/${safeKey}`, {
            method: "POST",
            body: payload,
            headers: { "Content-Type": "text/plain" }
          });
          if (r1.ok) ok = true;
        } catch(e1) {}

        // 通道 2: 备用通用中转
        if (!ok) {
          const r2 = await fetch(`https://api.restful-api.dev/objects`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: safeKey, data: { val: payload, time: Date.now() } })
          });
          if (r2.ok) {
            const data = await r2.json();
            localStorage.setItem("BACKUP_REMOTE_ID_" + safeKey, data.id);
            ok = true;
          }
        }

        if (!ok) throw new Error("所有通道连接超时");

        appData.lastSync = new Date().toLocaleTimeString();
        saveState();
        renderSyncTab();
        updateSyncStatus("推送成功！另一端输入相同口令点击【从云端拉取】即可", true);
        showToast("上传成功！");
      } catch (err) {
        updateSyncStatus("连接超时，可使用下方【导出备份】通过微信传输", false);
        showToast("同步受阻，建议微信传离线备份");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i><span>上传推送到云端</span>';
      }
    }

    async function pullFromCloud(silent = false) {
      const code = document.getElementById("syncPasscodeInput") ? document.getElementById("syncPasscodeInput").value.trim() : (appData.passcode || "chan888");
      if (!code) { if (!silent) showToast("请先设置口令"); return; }
      appData.passcode = code;

      const btn = document.getElementById("btnPull");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>拉取中...</span>';
      }
      if (!silent) updateSyncStatus("正在从云端拉取...", true);

      const safeKey = "fit_" + encodeURIComponent(code);
      let remoteText = "";

      try {
        // 先尝试从通道 1 拉取
        try {
          const r1 = await fetch(`https://api.keyvalue.xyz/get/${safeKey}?t=${Date.now()}`);
          if (r1.ok) remoteText = await r1.text();
        } catch(e1) {}

        // 尝试从备用通道拉取
        if (!remoteText) {
          const cachedId = localStorage.getItem("BACKUP_REMOTE_ID_" + safeKey);
          if (cachedId) {
            const r2 = await fetch(`https://api.restful-api.dev/objects/${cachedId}`);
            if (r2.ok) {
              const resJson = await r2.json();
              if (resJson.data && resJson.data.val) remoteText = resJson.data.val;
            }
          }
        }

        if (!remoteText) throw new Error("未读取到数据");

        const remoteData = JSON.parse(remoteText);
        remoteData.passcode = code;
        remoteData.lastSync = new Date().toLocaleTimeString();
        appData = remoteData;
        saveState();

        switchTab(currentTab);
        updateSyncStatus("已成功同步最新数据！", true);
        showToast(silent ? "已自动拉取最新进度" : "同步完成！");
      } catch (err) {
        if (!silent) {
          updateSyncStatus("未找到云端数据，请先在电脑端点击【上传推送到云端】", false);
          showToast("拉取失败，请先上传");
        }
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i><span>从云端拉取</span>';
        }
      }
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `fitness_backup_${formatDateYMD(new Date())}.json`;
      a.click();
    }

    function importBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          appData = JSON.parse(ev.target.result);
          saveState();
          switchTab("train");
          showToast("备份导入成功！");
        } catch(err) {
          showToast("导入失败");
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderTrainTab();
      renderSyncTab();
      if (appData.passcode) pullFromCloud(true);
    });
  </script>
</body>
</html>
